<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - CRYSTAL</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Colors CSS -->
    <link rel="stylesheet" href="../css/colors.css">
    <!-- Recovery Page CSS -->
    <link rel="stylesheet" href="../css/recover.css">
</head>
<body>
    <!-- Main container for the password recovery form -->
    <div class="recovery-container">
        <!-- Recovery form wrapper -->
        <div class="recovery-form-wrapper">
            <!-- Header section with title -->
            <div class="recovery-header">
                <h1>CRYSTAL</h1>
                <p>Recuperar Contraseña</p>
            </div>

            <!-- Main recovery form -->
            <form id="recoveryForm" class="recovery-form">
                <!-- Email input field for account lookup -->
                <div class="form-group">
                    <label for="recoveryEmail">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="recoveryEmail" 
                        name="recoveryEmail" 
                        placeholder="Ingresa tu correo registrado"
                        required
                    >
                </div>

                <!-- Success or error message display area -->
                <div id="recoveryMessage" class="recovery-message"></div>

                <!-- Submit button to send recovery email -->
                <button type="submit" class="btn-recovery">Enviar Instrucciones</button>
            </form>

            <!-- Footer section with navigation links -->
            <div class="recovery-footer">
                <!-- Link back to login page -->
                <p class="back-to-login">
                    Recordaste tu contraseña?
                    <a href="login.html" class="back-to-login-link">Volver al Login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script file with recovery functionality -->
    <script src="../js/recover.js"></script>
</body>
</html>
